# Dev container overrides - only adds tooling env file
services:
  auth-app:
    volumes:
      - ../../git-scripts:/microservice-auth-service/git-scripts:cached
    tty: true
    # Note: Stop standalone services before opening in devcontainer if they're running
    command: |
      sh -c "chmod +x .devcontainer/scripts/*.sh && .devcontainer/scripts/container-startup.sh dev"

    env_file:
      - ../../environment/common-services-app-tooling.env
