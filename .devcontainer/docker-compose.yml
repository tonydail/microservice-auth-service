version: "3.9"

services:
  app:
    image: mcr.microsoft.com/devcontainers/typescript-node:1-20-bullseye
    container_name:  ${AUTH_APP_HOST}
    volumes:
      - ..:/microservice-auth-service:cached
      - microservice_auth_service_node_modules:/microservice-auth-service/node_modules
      - microservice_auth_service_dist:/microservice-auth-service/dist
    working_dir: /microservice-auth-service
    command: sleep infinity
    env_file:
      - ../../environment/container-hosts.env
      - ../../environment/common-service-db.env
      - ../../environment/microservice-auth-service-db.env
      - ../../environment/common-services-app.env
      - ../../environment/microservice-auth-service-app.env
      - ../../environment/common-services-app-tooling.env
    depends_on:
      auth-db:
        condition: service_healthy
    networks:
      - microservices-net

  auth-db:
    image: postgres:16-alpine
    container_name:  ${AUTH_DB_HOST}
    restart: unless-stopped
    env_file:
      - ../../environment/container-hosts.env
      - ../../environment/common-service-db.env
      - ../../environment/microservice-auth-service-db.env
    ports:
      - "5433:5432"
    volumes:
      - auth-db-data:/var/lib/postgresql/data
    # Enable logical replication for Debezium CDC
    command: postgres -c wal_level=logical -c max_replication_slots=4 -c max_wal_senders=4
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth_user -d auth_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - microservices-net

volumes:
  auth-db-data:
  microservice_auth_service_node_modules:
  microservice_auth_service_dist:

networks:
  microservices-net:
    external: true
    name: microservices-net
